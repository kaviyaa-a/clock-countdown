<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

    <div class="container-fluid border text-center mt-4 p-3" style="width: 500px; border-radius: 10px;">
        <h5>Live Clock</h5>

        <h2 class="my-3" id="timer"></h2>
        <div class="row">
            <button onclick="startTime()" class="col">Start</button>
            <button onclick="stopTimer()" class="col">Stop</button>
        </div>

        <h4>Countdown</h4>
        <div class="row">
            <input id="count" class="col" type="number">
            <button onclick="startCountDown()" class="col">start</button>
        </div>

        <h3 id="countdown"></h3>
        <p id="timesUp">Times up!</p>
    </div>
    
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
